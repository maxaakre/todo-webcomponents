name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repo. Without this, the token gets the repo's
# default permissions, which can include write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser tests in packages/ui need a real Chromium.
      - run: pnpm --filter @maxaakre/ui exec playwright install --with-deps chromium

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # The manifest and the React types generated from it are committed,
      # so API changes show up in review. Fail if a component changed
      # without regenerating them.
      - name: Manifest and React types are up to date
        run: git diff --exit-code -- packages/ui/custom-elements.json packages/ui/src/react.d.ts

      - run: pnpm --filter @maxaakre/ui build-storybook --quiet

      # Unit tests do not tree-shake. This opens every built story and
      # checks each ui-* element is defined, so a bad sideEffects entry
      # cannot silently delete a component from production bundles.
      - run: pnpm --filter @maxaakre/ui smoke-storybook

      - name: Package is publishable
        run: pnpm --filter @maxaakre/ui publish --dry-run --no-git-checks
